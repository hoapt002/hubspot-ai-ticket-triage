<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ticket Triage</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <div class="login-wrap">
    <form class="card login" method="post" action="/login">
      <div class="brand">{{ icon('flash', 22) }} Ticket Triage</div>
      <h1>Sign in</h1>
      <p class="muted">Reviewer access for the support triage queue.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</body>
</html>
