[project]
name = "hubspot-ai-ticket-triage"
version = "0.1.0"
description = "Webhook-driven support ticket triage: LLM classification, customer data extraction, HubSpot ticket creation, human review and handling-time measurement."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.75",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "openai>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
triage = "ticket_triage.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ticket_triage"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
